[package]
name = "textifyopendocument"
version = "0.1.2"
edition = "2021"
license = "GPL-2.0-only"
description = "Fast OpenDocument to plain text converter for previews"
repository = "https://github.com/jbrains/textifyopendocument"
homepage = "https://github.com/jbrains/textifyopendocument"
documentation = "https://github.com/jbrains/textifyopendocument"
keywords = ["odt", "ods", "opendocument", "preview", "cli"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"
exclude = ["odt2txt/**", "acceptance-tests/**", "docs/**", "packaging/**"]

[dependencies]
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
